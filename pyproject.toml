[project]
name = "pytest-for-atoms"
version = "0.1.0"
description = "Agentic 3D-modeling factory: NL spec -> build123d part optimized to pass a pytest-style printability suite."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "build123d>=0.9",
    "pytest>=8.0",
    "numpy>=1.26",
    "trimesh>=4.0",
    "rtree>=1.0",  # ray backend for measure.min_wall_mm inward ray-casting
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atoms", "factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
