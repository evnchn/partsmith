[project]
name = "partsmith"
version = "0.1.0"
description = "Partsmith — an agentic 3D-modeling factory; parts ship only when Partsmith Caliper verifies them printable."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "build123d>=0.9",
    "pytest>=8.0",
    "numpy>=1.26",
    "trimesh>=4.0",
    "rtree>=1.0",  # ray backend for measure.min_wall_mm inward ray-casting
]

[project.optional-dependencies]
render = ["matplotlib>=3.8", "pillow>=10", "imageio>=2.30"]  # tools/render.py demo visuals

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caliper", "factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
